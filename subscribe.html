<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Abonnement aux notifications</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 30px; line-height: 1.5; }
    .success { color: #2e7d32; font-weight: bold; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <h3 id="status">Demande d'autorisation en cours...</h3>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCmbImmOUnB4k0iuVSkFeWIz-8je8ZbxmA",
      authDomain: "forum-discussion-f47cc.firebaseapp.com",
      databaseURL: "https://forum-discussion-f47cc-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "forum-discussion-f47cc",
      storageBucket: "forum-discussion-f47cc.firebasestorage.app",
      messagingSenderId: "479671843496",
      appId: "1:479671843496:web:0b338af1d5cced5f9ce09d"
    };

    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const topic = urlParams.get('topic') || 'general';

    async function activer() {
      const statusEl = document.getElementById("status");
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          statusEl.innerText = "Enregistrement en cours...";

          const registration = await navigator.serviceWorker.register('/notifs-site/firebase-messaging-sw.js');

          const token = await messaging.getToken({
            vapidKey: "BAj0tfDu2K645favJn2epR7w0gZpBa1R3JEW24U0BXHhkBL4ouL8Vgr_L18dfhjcRnh8PYYp-usbYQ1B0X4dA0A",
            serviceWorkerRegistration: registration
          });

          if (token) {
            await db.collection("abonnements_fcm").doc(token).set({
              token: token,
              pageTopic: topic,
              date: new Date().toISOString()
            });

            statusEl.className = "success";
            statusEl.innerHTML = "✅ Alertes activées !<br><small>Tu peux fermer cette fenêtre.</small>";
          }
        } else {
          statusEl.className = "error";
          statusEl.innerText = "Autorisation refusée.";
        }
      } catch (err) {
        console.error(err);
        statusEl.className = "error";
        statusEl.innerText = "Erreur technique lors de l'enregistrement.";
      }
    }

    activer();
  </script>
</body>
</html>
